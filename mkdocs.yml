site_name: "PWR Operations"
site_description: "Westinghouse-style PWR operating knowledge — procedures, plant reference, human factors, scenarios — authored in Procedure Markdown (procmd) v0.6"
site_url: "https://samsinn-wikis.github.io/pwr-ops/"
docs_dir: _build/wiki
repo_url: "https://github.com/samsinn-wikis/pwr-ops"
repo_name: "samsinn-wikis/pwr-ops"
# Edit links point at the canonical source under wiki/, not the gitignored
# transformed output under _build/wiki/.
edit_uri: edit/main/wiki/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.action.edit
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list
  - footnotes
  # Required for <section markdown="1"> wrappers (procmd v0.5 ## Tags appendix)
  # to have their inner content parsed as markdown rather than raw HTML.
  - md_in_html

extra_css:
  - visibility.css
  - procedure.css
  - mermaid.css

extra_javascript:
  - visibility.js

extra:
  wiki_version: "0.1.0"
  procmd_version: "0.7"
  # Substituted at CI time from vars.FEEDBACK_WORKER_URL by the deploy workflow.
  # Empty string means the feedback modal runs in demo mode (logs payload, no POST).
  feedback_worker_url: ""

nav:
  - Home: index.md
  - About:
    - Scope and disclaimers: scope.md
    - Reference sources: sources.md
    - Procedure Markdown (procmd): procmd.md
    - samsinn integration: samsinn-integration.md
  - Procedures:
    - E-series (Initial Diagnostic):
      - procedures/E-0.md
      - procedures/E-1.md
      - procedures/E-2.md
      - procedures/E-3.md
    - ECA-series (Extreme Conditions):
      - procedures/ECA-0.0.md
      - procedures/ECA-1.1.md
      - procedures/ECA-1.2.md
      - procedures/ECA-2.1.md
      - procedures/ECA-3.1.md
      - procedures/ECA-3.2.md
      - procedures/ECA-3.3.md
    - ES-series (Post-Trip Recovery):
      - procedures/ES-0.0.md
      - procedures/ES-0.1.md
      - procedures/ES-0.2.md
      - procedures/ES-1.1.md
      - procedures/ES-1.2.md
      - procedures/ES-1.3.md
      - procedures/ES-1.4.md
      - procedures/ES-3.1.md
      - procedures/ES-3.2.md
      - procedures/ES-3.3.md
    - FR-S (Subcriticality CSF):
      - procedures/FR-S.1.md
      - procedures/FR-S.2.md
    - FR-C (Core Cooling CSF):
      - procedures/FR-C.1.md
      - procedures/FR-C.2.md
      - procedures/FR-C.3.md
    - FR-H (Heat Sink CSF):
      - procedures/FR-H.1.md
      - procedures/FR-H.2.md
      - procedures/FR-H.3.md
      - procedures/FR-H.4.md
      - procedures/FR-H.5.md
    - FR-P (RCS Integrity CSF):
      - procedures/FR-P.1.md
      - procedures/FR-P.2.md
    - FR-Z (Containment CSF):
      - procedures/FR-Z.1.md
      - procedures/FR-Z.2.md
      - procedures/FR-Z.3.md
    - FR-I (RCS Inventory CSF):
      - procedures/FR-I.1.md
      - procedures/FR-I.2.md
      - procedures/FR-I.3.md
  - Plant reference:
    - Systems:
      - Reactor coolant (RCS): systems/rcs.md
      - Emergency core cooling (ECCS): systems/eccs.md
      - Auxiliary feedwater (AFW): systems/afw.md
      - Main steam (MSS): systems/mss.md
      - Reactor protection (RPS): systems/rps.md
      - Residual heat removal (RHR): systems/rhr.md
      - Engineered safety features (ESF): systems/esf.md
      - Electrical distribution: systems/electrical.md
      - Chemical and volume control (CVCS): systems/cvcs.md
      - Containment + spray: systems/containment.md
      - Nuclear instrumentation (NIS): systems/nis.md
      - Balance of plant (BOP): systems/bop.md
    - Catalogues:
      - Tag catalogue: tags/index.md
      - Setpoint catalogue: setpoints/index.md
  - Scenarios:
    - Small-break LOCA: scenarios/sb-loca.md
    - Large-break LOCA: scenarios/lb-loca.md
    - Steam Generator Tube Rupture: scenarios/sgtr.md
    - Station blackout: scenarios/sbo.md
    - ATWS: scenarios/atws.md
  - EAL classification:
    - Rule table: eal/classification-rules.md
  - Simulator bindings:
    - samsinn: simulator-bindings/samsinn.md
  - Profiles:
    - profiles/nuclear-erg.md
