site_name: "Leitbild PWR"
site_description: "Reference handbook for the PWR plant simulated in Leitbild: process model, component graph, physics, I&C, alarms, procedures, scenarios, and AI-agent operation"
site_url: "https://samsinn-wikis.github.io/pwr-ops/"
docs_dir: _build/wiki
repo_url: "https://github.com/samsinn-wikis/pwr-ops"
repo_name: "samsinn-wikis/pwr-ops"
# Edit links point at the canonical source under wiki/, not the gitignored
# transformed output under _build/wiki/.
edit_uri: edit/main/wiki/

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.action.edit
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list
  - footnotes
  # Required for <section markdown="1"> wrappers (procmd v0.5 ## Tags appendix)
  # to have their inner content parsed as markdown rather than raw HTML.
  - md_in_html

extra_css:
  - visibility.css
  - procedure.css

extra_javascript:
  - visibility.js

extra:
  wiki_version: "0.1.0"
  procmd_version: "0.7"
  # Substituted at CI time from vars.FEEDBACK_WORKER_URL by the deploy workflow.
  # Empty string means the feedback modal runs in demo mode (logs payload, no POST).
  feedback_worker_url: ""

