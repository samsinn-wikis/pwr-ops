site_name: "PWR Emergency Operating Procedures"
site_description: "Westinghouse PWR EOPs in Procedure Markdown (procmd) format — demo and design artifact"
site_url: "https://michaelhil.github.io/pwr-eops/"
docs_dir: wiki
repo_url: "https://github.com/samsinn-wikis/pwr-eops"
repo_name: "samsinn-wikis/pwr-eops"

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - roamlinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - def_list
  - footnotes

extra:
  wiki_version: "0.1.0"
  procmd_version: "0.1"

nav:
  - Home: index.md
  - Scope and disclaimers: scope.md
  - E-series (Initial Diagnostic):
    - procedures/E-0.md
    - procedures/E-1.md
    - procedures/E-2.md
    - procedures/E-3.md
  - ECA-series (Extreme Conditions):
    - procedures/ECA-0.0.md
    - procedures/ECA-1.1.md
    - procedures/ECA-1.2.md
    - procedures/ECA-2.1.md
    - procedures/ECA-3.1.md
    - procedures/ECA-3.2.md
    - procedures/ECA-3.3.md
  - ES-series (Post-Trip Recovery):
    - procedures/ES-0.0.md
    - procedures/ES-0.1.md
    - procedures/ES-0.2.md
    - procedures/ES-1.1.md
    - procedures/ES-1.2.md
    - procedures/ES-1.3.md
    - procedures/ES-1.4.md
    - procedures/ES-3.1.md
    - procedures/ES-3.2.md
    - procedures/ES-3.3.md
  - FR-S (Subcriticality CSF):
    - procedures/FR-S.1.md
    - procedures/FR-S.2.md
  - FR-C (Core Cooling CSF):
    - procedures/FR-C.1.md
    - procedures/FR-C.2.md
    - procedures/FR-C.3.md
  - FR-H (Heat Sink CSF):
    - procedures/FR-H.1.md
    - procedures/FR-H.2.md
    - procedures/FR-H.3.md
    - procedures/FR-H.4.md
    - procedures/FR-H.5.md
  - FR-P (RCS Integrity CSF):
    - procedures/FR-P.1.md
    - procedures/FR-P.2.md
  - FR-Z (Containment CSF):
    - procedures/FR-Z.1.md
    - procedures/FR-Z.2.md
    - procedures/FR-Z.3.md
  - FR-I (RCS Inventory CSF):
    - procedures/FR-I.1.md
    - procedures/FR-I.2.md
    - procedures/FR-I.3.md
  - Profiles:
    - profiles/nuclear-erg.md
