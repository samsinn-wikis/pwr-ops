{% extends "base.html" %}

{% block extrahead %}
<meta name="wiki-version" content="{{ config.extra.wiki_version }}">
<!-- procmd visibility prefs — applied pre-paint to avoid FOUC -->
<script>
(function () {
  try {
    var raw = localStorage.getItem('pwr-eops:visibility-prefs');
    if (!raw) return;
    var p = JSON.parse(raw);
    if (p.version !== 1) return;
    var c = document.documentElement.classList;
    if (p.prefs.rationale === false)    c.add('hide-rationale');
    if (p.prefs.stepIdSuffix === false) c.add('hide-step-id-suffix');
    if (p.prefs.tag === false)          c.add('hide-tag');
    if (p.prefs.tagAppendix === false)  c.add('hide-tag-appendix');
  } catch (e) {}
})();
</script>
<style>
  .feedback-icon {
    opacity: 0;
    transition: opacity 0.15s;
    cursor: pointer;
    margin-left: 0.4em;
    font-size: 0.75em;
    vertical-align: middle;
    text-decoration: none;
    user-select: none;
    line-height: 1;
  }
  h2:hover > .feedback-icon,
  h3:hover > .feedback-icon,
  .md-content__inner p:hover > .feedback-icon,
  .md-content__inner li:hover > .feedback-icon,
  .md-content__inner blockquote:hover > .feedback-icon {
    opacity: 0.45;
  }
  .feedback-icon:hover,
  .feedback-icon:focus {
    opacity: 1 !important;
    outline: none;
  }
  /* Block-level feedback icons get a fixed position at line end so they don't
     reflow paragraph text on hover. */
  .feedback-icon-block {
    float: right;
    margin-left: 0.8em;
  }
  .feedback-modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }
  .feedback-modal-overlay.active {
    display: flex;
  }
  .feedback-modal {
    background: var(--md-default-bg-color, #fff);
    color: var(--md-default-fg-color, #333);
    border-radius: 8px;
    padding: 24px;
    max-width: 480px;
    width: 90%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }
  .feedback-modal h3 {
    margin-top: 0;
    font-size: 1.1em;
  }
  .feedback-modal .fb-type-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .feedback-modal .fb-type-group label {
    padding: 4px 12px;
    border: 1px solid var(--md-default-fg-color--lighter, #ccc);
    border-radius: 16px;
    cursor: pointer;
    font-size: 0.85em;
  }
  .feedback-modal .fb-type-group input:checked + label {
    background: var(--md-primary-fg-color, #4051b5);
    color: #fff;
    border-color: var(--md-primary-fg-color, #4051b5);
  }
  .feedback-modal .fb-type-group input {
    display: none;
  }
  .feedback-modal textarea {
    width: 100%;
    min-height: 100px;
    border: 1px solid var(--md-default-fg-color--lighter, #ccc);
    border-radius: 4px;
    padding: 8px;
    font-family: inherit;
    font-size: 0.9em;
    background: var(--md-default-bg-color, #fff);
    color: var(--md-default-fg-color, #333);
    resize: vertical;
    box-sizing: border-box;
  }
  .feedback-modal input[type="text"] {
    width: 100%;
    border: 1px solid var(--md-default-fg-color--lighter, #ccc);
    border-radius: 4px;
    padding: 6px 8px;
    font-family: inherit;
    font-size: 0.9em;
    background: var(--md-default-bg-color, #fff);
    color: var(--md-default-fg-color, #333);
    box-sizing: border-box;
  }
  .feedback-modal button.fb-submit {
    background: var(--md-primary-fg-color, #4051b5);
    color: #fff;
    border: none;
    padding: 8px 20px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9em;
    margin-top: 8px;
  }
  .feedback-modal button.fb-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .feedback-modal .fb-status {
    font-size: 0.85em;
    margin-top: 8px;
  }
</style>
{% endblock %}

{% block content %}
{{ super() }}

<div class="feedback-modal-overlay" id="fb-overlay">
  <div class="feedback-modal">
    <h3>Leave feedback on this section</h3>
    <p id="fb-section-label" style="font-size:0.85em; color: var(--md-default-fg-color--light, #666); margin-bottom:12px;"></p>
    <div class="fb-type-group">
      <input type="radio" name="fb-type" id="fb-correction" value="correction">
      <label for="fb-correction">Correction</label>
      <input type="radio" name="fb-type" id="fb-suggestion" value="suggestion">
      <label for="fb-suggestion">Suggestion</label>
      <input type="radio" name="fb-type" id="fb-missing" value="missing">
      <label for="fb-missing">Missing info</label>
      <input type="radio" name="fb-type" id="fb-unclear" value="unclear">
      <label for="fb-unclear">Unclear</label>
    </div>
    <textarea id="fb-text" placeholder="Describe the issue or suggestion..." required></textarea>
    <div style="margin-top:8px;">
      <input type="text" id="fb-name" placeholder="Your name (optional)">
    </div>
    <button class="fb-submit" id="fb-submit" disabled>Submit feedback</button>
    <div class="fb-status" id="fb-status"></div>
  </div>
</div>

<script>
(function() {
  var DEBOUNCE_MS = 30000;
  var lastSubmit = 0;
  var workerUrl = '{{ config.extra.feedback_worker_url }}';

  // Anchor every feedback icon to its nearest preceding h2/h3 id so the
  // GitHub issue lands in a deterministic section, with an excerpt of the
  // exact block the user clicked.
  function nearestSectionId(el) {
    var cur = el;
    while (cur && cur.previousElementSibling) {
      cur = cur.previousElementSibling;
      if (cur.id && /^H[1-3]$/.test(cur.tagName)) return { id: cur.id, label: cur.textContent.replace('\uD83D\uDCAC','').trim() };
    }
    // climb out of nested lists/blockquotes
    if (el.parentElement && el.parentElement !== document.body) return nearestSectionId(el.parentElement);
    var h1 = document.querySelector('article h1');
    return h1 ? { id: h1.id || '', label: h1.textContent.replace('\u00B6','').trim() } : { id: '', label: document.title };
  }

  function makeIcon(targetEl, blockKind) {
    var icon = document.createElement('a');
    icon.className = 'feedback-icon' + (blockKind ? ' feedback-icon-block' : '');
    icon.textContent = '\uD83D\uDCAC';
    icon.title = 'Leave feedback on this' + (blockKind ? ' ' + blockKind : ' section');
    icon.href = '#';
    icon.setAttribute('aria-label', icon.title);
    icon.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var anchor = nearestSectionId(targetEl);
      var excerpt = '';
      if (blockKind) {
        excerpt = targetEl.textContent.replace('\uD83D\uDCAC', '').trim();
        if (excerpt.length > 240) excerpt = excerpt.slice(0, 240) + '\u2026';
      }
      openModal(anchor.id, anchor.label, excerpt);
    });
    targetEl.appendChild(icon);
  }

  // Headings (anchor sections)
  document.querySelectorAll('article h2[id], article h3[id]').forEach(function(h) {
    makeIcon(h, '');
  });
  // Block-level: paragraphs, list items, blockquotes inside the article body.
  // Skip nav, TOC, footer, admonition titles, and the inert source-raw block.
  var blockSel = '.md-content__inner > p, .md-content__inner > ul > li, .md-content__inner > ol > li, ' +
                 '.md-content__inner > blockquote, .md-content__inner .admonition > p';
  document.querySelectorAll(blockSel).forEach(function(el) {
    if (el.closest('.procmd-source-raw, .md-nav, .md-footer, .md-source-file, .toc')) return;
    if (el.querySelector('.feedback-icon')) return;
    var kind = el.tagName === 'LI' ? 'item' : (el.tagName === 'BLOCKQUOTE' ? 'note' : 'paragraph');
    makeIcon(el, kind);
  });

  var overlay = document.getElementById('fb-overlay');
  var sectionLabel = document.getElementById('fb-section-label');
  var submitBtn = document.getElementById('fb-submit');
  var statusEl = document.getElementById('fb-status');
  var textArea = document.getElementById('fb-text');
  var currentSection = '';

  var currentExcerpt = '';
  function openModal(sectionId, sectionText, excerpt) {
    currentSection = sectionId;
    currentExcerpt = excerpt || '';
    var label = 'Section: ' + sectionText;
    if (currentExcerpt) label += '\n“' + currentExcerpt + '”';
    sectionLabel.textContent = label;
    sectionLabel.style.whiteSpace = 'pre-wrap';
    overlay.classList.add('active');
    statusEl.textContent = '';
    textArea.value = '';
    document.getElementById('fb-name').value = '';
    document.querySelectorAll('input[name="fb-type"]').forEach(function(r) { r.checked = false; });
    submitBtn.disabled = true;
  }

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.classList.remove('active');
  });

  // Enable submit when type selected and text entered
  function checkReady() {
    var typeSelected = document.querySelector('input[name="fb-type"]:checked');
    submitBtn.disabled = !(typeSelected && textArea.value.trim());
  }
  document.querySelectorAll('input[name="fb-type"]').forEach(function(r) {
    r.addEventListener('change', checkReady);
  });
  textArea.addEventListener('input', checkReady);

  submitBtn.addEventListener('click', function() {
    var now = Date.now();
    if (now - lastSubmit < DEBOUNCE_MS) {
      statusEl.textContent = 'Please wait before submitting again.';
      return;
    }
    var type = document.querySelector('input[name="fb-type"]:checked').value;
    var text = textArea.value.trim();
    var name = document.getElementById('fb-name').value.trim();
    var payload = {
      page: window.location.pathname,
      page_url: window.location.href,
      section: currentSection,
      excerpt: currentExcerpt,
      type: type,
      text: text,
      name: name || 'Anonymous',
      wiki_version: document.querySelector('meta[name="wiki-version"]').content,
      timestamp: new Date().toISOString()
    };

    if (!workerUrl) {
      statusEl.textContent = 'Demo mode: feedback would be sent to ' + JSON.stringify(payload);
      lastSubmit = now;
      return;
    }

    submitBtn.disabled = true;
    statusEl.textContent = 'Sending...';
    fetch(workerUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r) {
      if (r.ok) {
        statusEl.textContent = 'Thank you! Feedback submitted.';
        lastSubmit = now;
        setTimeout(function() { overlay.classList.remove('active'); }, 1500);
      } else {
        statusEl.textContent = 'Error submitting feedback. Please try again.';
        submitBtn.disabled = false;
      }
    }).catch(function() {
      statusEl.textContent = 'Network error. Please try again.';
      submitBtn.disabled = false;
    });
  });
})();
</script>
{% endblock %}
