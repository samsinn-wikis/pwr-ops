name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure site URL
        run: |
          FEEDBACK_URL="${{ vars.FEEDBACK_WORKER_URL }}"
          if [ -n "$FEEDBACK_URL" ]; then
            sed -i "s|feedback_worker_url: \"\"|feedback_worker_url: \"$FEEDBACK_URL\"|" mkdocs.yml
          fi

      - name: Validate procmd corpus
        run: bun validate.ts

      - name: Export KG (JSON-LD)
        run: bun scripts/export-kg.ts

      - name: Build machine-readable manifest
        run: bun scripts/build-manifest.ts

      - name: Render procmd → enriched markdown
        run: bun scripts/render-procmd.ts

      - name: Build site
        run: mkdocs build

      - name: Stage KG + manifest artifacts into site
        run: |
          cp _build/kg.jsonld site/kg.jsonld
          cp wiki/_manifest.json site/_manifest.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
