name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify vendored procmd-core matches SHA pin
        run: |
          PIN=$(cat procmd-core.sha | tr -d '[:space:]')
          if [ -z "$PIN" ]; then
            echo "::error::procmd-core.sha is empty"
            exit 1
          fi
          BASE="https://raw.githubusercontent.com/michaelhil/samsinn/${PIN}/src/procmd-core"
          for f in parser.ts types.ts index.ts; do
            curl -sf "${BASE}/${f}" -o /tmp/upstream-${f} || {
              echo "::error::Could not fetch ${f} from samsinn@${PIN}"
              exit 1
            }
            if ! diff -q /tmp/upstream-${f} "procmd-core/${f}" > /dev/null; then
              echo "::error::procmd-core/${f} differs from samsinn@${PIN}"
              diff /tmp/upstream-${f} "procmd-core/${f}" | head -40
              exit 1
            fi
          done
          echo "✅ vendored procmd-core matches samsinn@${PIN}"

      - name: Configure site URL
        run: |
          FEEDBACK_URL="${{ vars.FEEDBACK_WORKER_URL }}"
          if [ -n "$FEEDBACK_URL" ]; then
            sed -i "s|feedback_worker_url: \"\"|feedback_worker_url: \"$FEEDBACK_URL\"|" mkdocs.yml
          fi

      - name: Validate procmd corpus (validate.ts)
        run: bun validate.ts

      - name: Cross-check corpus with procmd-core parser
        run: bun scripts/check-procmd-core.ts

      - name: Export KG (JSON-LD)
        run: bun scripts/export-kg.ts

      - name: Build tag + setpoint catalogues
        run: bun scripts/build-catalogues.ts

      - name: Build EAL rules JSON
        run: bun scripts/build-eal-rules.ts

      - name: Build search index
        run: bun scripts/build-search-index.ts

      - name: Build simulator bindings
        run: bun scripts/build-sim-bindings.ts

      - name: Build machine-readable manifest
        run: bun scripts/build-manifest.ts

      - name: Render procmd → enriched markdown
        run: bun scripts/render-procmd.ts

      - name: Build site
        run: mkdocs build

      - name: Stage KG + manifest + raw.md sidecars into site
        run: |
          cp _build/kg.jsonld site/kg.jsonld
          cp wiki/_manifest.json site/_manifest.json
          # Raw markdown sidecars so agents have a second fetch path when
          # raw.githubusercontent.com is rate-limited or degraded. Mirrors
          # the source procmd verbatim (not the build-time enriched form).
          mkdir -p site/procedures site/profiles
          cp wiki/procedures/*.md site/procedures/
          cp wiki/profiles/*.md site/profiles/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
